name: Auto F1 Calendar Ingestion

on:
  schedule:
    # Friday evening PST (03:00 UTC Saturday) — Ingests FP1, FP2, Sprint Qualifying
    - cron: '0 3 * * 6'
    # Saturday evening PST (03:00 UTC Sunday) — Ingests FP3, Qualifying, Sprint
    - cron: '0 3 * * 0'
    # Monday at 14:00 UTC (06:00 AM PST) — Ingests completed Grand Prix race results
    - cron: '0 14 * * 1'
    # Tuesday at 02:00 UTC (18:00 PST Monday) — Safety catch-up run
    - cron: '0 2 * * 2'
  workflow_dispatch: # Also allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Live Weekend & Historical Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas fastf1 duckduckgo-search

      - name: Ingest race weekend sessions & past missing races
        # 1. Pulls completed practice, qualifying, and sprint sessions for the active weekend
        # 2. Ingests any completed past races that might be missing
        run: |
          PYTHONPATH=backend python3 backend/data_loader.py --current
          PYTHONPATH=backend python3 backend/data_loader.py --past-missing

      - name: Run news agent technical scraper
        # Scrapes technical upgrade news for the upcoming race weekend
        run: |
          PYTHONPATH=backend python3 backend/news_agent.py

      - name: Commit & push new data
        run: |
          git config --global user.name  "Paddock Scout Bot"
          git config --global user.email "actions@github.com"
          git add data/ live_tech_updates.json
          # Only commit if any new files were staged
          if git diff --staged --quiet; then
            echo "No new race data or technical updates to commit."
          else
            git commit -m "auto-ingest: new weekend telemetry & technical upgrades"
            git push
          fi
