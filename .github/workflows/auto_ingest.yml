name: Auto F1 Calendar Ingestion

on:
  schedule:
    # Run every Monday at 14:00 UTC (giving ample time for FIA & F1 timing data to finalize)
    # and Tuesday at 02:00 UTC as a safety catch-up
    - cron: '0 14 * * 1'
    - cron: '0 2 * * 2'
  workflow_dispatch: # Also allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Missing Race Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas fastf1

      - name: Run past-missing ingestion
        # Scans completed races, downloads any that are missing a CSV from data/
        run: |
          PYTHONPATH=backend python3 backend/data_loader.py --past-missing

      - name: Commit & push new data
        run: |
          git config --global user.name  "Paddock Scout Bot"
          git config --global user.email "actions@github.com"
          git add data/
          # Only commit if any new files were staged
          if git diff --staged --quiet; then
            echo "No new race data to commit."
          else
            git commit -m "auto-ingest: new race telemetry"
            git push
          fi
