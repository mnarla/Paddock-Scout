name: Auto F1 Calendar Ingestion

on:
  schedule:
    # Friday evening:
    # - 21:00 UTC Friday (European evening / US afternoon)
    # - 03:00 UTC Saturday (8 PM PST / 11 PM EST Friday evening)
    - cron: '0 21 * * 5'
    - cron: '0 3 * * 6'

    # Saturday evening:
    # - 21:00 UTC Saturday (European evening / US afternoon)
    # - 03:00 UTC Sunday (8 PM PST / 11 PM EST Saturday evening)
    - cron: '0 21 * * 6'
    - cron: '0 3 * * 0'

    # Sunday evening & catch-up:
    # - 21:00 UTC Sunday (European evening / US afternoon)
    # - 03:00 UTC Monday (8 PM PST / 11 PM EST Sunday evening)
    # - 14:00 UTC Monday (Safety catch-up)
    - cron: '0 21 * * 0'
    - cron: '0 3 * * 1'
    - cron: '0 14 * * 1'

  workflow_dispatch:
    inputs:
      day:
        description: 'Session day to ingest (friday, saturday, sunday, auto, all)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - friday
          - saturday
          - sunday
          - all

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Live Weekend & Historical Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas fastf1 duckduckgo-search

      - name: Ingest race weekend sessions & past missing races
        # Friday: FP1, FP2
        # Saturday: FP3, Qualifying, and Sprint (if sprint weekend)
        # Sunday: Grand Prix Race results
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_DAY="${{ inputs.day }}"
          else
            case "${{ github.event.schedule }}" in
              "0 21 * * 5"|"0 3 * * 6")
                TARGET_DAY="friday"
                ;;
              "0 21 * * 6"|"0 3 * * 0")
                TARGET_DAY="saturday"
                ;;
              "0 21 * * 0"|"0 3 * * 1"|"0 14 * * 1")
                TARGET_DAY="sunday"
                ;;
              *)
                TARGET_DAY="auto"
                ;;
            esac
          fi

          echo "Ingesting active weekend for target day: $TARGET_DAY"
          PYTHONPATH=backend python3 backend/data_loader.py --current --day "$TARGET_DAY"

          # On Sunday / Monday runs, also check for any completed past races
          if [ "$TARGET_DAY" = "sunday" ] || [ "$TARGET_DAY" = "all" ] || [ "$TARGET_DAY" = "auto" ]; then
            PYTHONPATH=backend python3 backend/data_loader.py --past-missing
          fi

      - name: Run news agent technical scraper
        # Scrapes technical upgrade news for the upcoming race weekend
        run: |
          PYTHONPATH=backend python3 backend/news_agent.py

      - name: Commit & push new data
        run: |
          git config --global user.name  "Paddock Scout Bot"
          git config --global user.email "actions@github.com"
          git add data/ live_tech_updates.json
          # Only commit if any new files were staged
          if git diff --staged --quiet; then
            echo "No new race data or technical updates to commit."
          else
            git commit -m "auto-ingest: new weekend telemetry & technical upgrades"
            git push
          fi
